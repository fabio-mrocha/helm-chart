{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.httpRoute.enabled }}
{{- $httpRouteGw := .Values.gatewayApi.httpRoute }}
{{- $root := . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    {{- include "gateway.labels" $root | nindent 4 }}
  name: {{ include "gateway.releaseName" $root }}
spec:
  {{- if $httpRouteGw.parentRefs }}
  parentRefs:
{{- range $httpRouteGw.parentRefs }}
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .name }}
    namespace: {{ .namespace }}
{{- end }}
  {{- end }}
  {{- if $httpRouteGw.hostnames }}
  hostnames:
{{- range $httpRouteGw.hostnames }}
  - {{ . | quote }}
{{- end }}
  {{- end }}
  {{- if $httpRouteGw.rules }}
  rules:
{{- range $httpRouteGw.rules }}
  - matches:
{{- range .matches }}
    - path:
        type: {{ .type | default "PathPrefix" }}
        value: {{ .path }}
{{- end }}
    {{- if .backendRefs }}
    backendRefs:
{{- toYaml .backendRefs | nindent 4 }}
    {{- else }}
    backendRef:
    - name: {{ include "gateway.releaseName" $root }}
      port: {{ $root.Values.service.port | default 8080 }}
    {{- end }}
{{- end }}
  {{- end }}
{{- end }}
