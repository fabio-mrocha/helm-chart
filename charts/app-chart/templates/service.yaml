{{- if .Values.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.deployment.bluegreen.enabled }}
  name: {{ include "sample.releaseName" . }}-active
  {{- else }}
  name: {{ include "sample.releaseName" . }}
  {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sample.labels" . | nindent 4 }}
spec:
  {{- if .Values.service.headless }}
  clusterIP: None
  {{- else }}
  type: {{ .Values.service.type }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- if .Values.service.additional.ports }}
    {{- toYaml .Values.service.additional.ports | nindent 4 }}
  {{- end }}
  selector:
    {{- include "sample.selectorLabels" . | nindent 4 }}
{{- end }}

---
{{- if and .Values.service.enabled .Values.deployment.bluegreen.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample.releaseName" . }}-preview
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sample.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- if .Values.service.additional.ports }}
    {{- toYaml .Values.service.additional.ports | nindent 4 }}
  {{- end }}
  selector:
    {{- include "sample.selectorLabels" . | nindent 4 }}
{{- end }}
