{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample.releaseName" . }}
  labels:
    {{- include "sample.labels" . | nindent 4 }}
{{- with .Values.configmap.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- if .Values.configmap.binaryData }}
{{- with .Values.configmap.binaryData }}
binaryData:
  {{ toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
