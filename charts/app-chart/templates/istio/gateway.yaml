{{- if and .Values.istio.enabled .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "sample.releaseName" . }}
spec:
  selector:
    istio: {{ include "sample.releaseName" . }}
  servers:
    - hosts:
        - "*"
      port:
        number: {{ .Values.istio.gateway.port }}
        name: http
        protocol: {{ .Values.istio.gateway.protocol }}
{{- end }}
