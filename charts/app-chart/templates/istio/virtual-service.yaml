{{- if and .Values.istio.enabled .Values.istio.virtualService.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "sample.releaseName" . }}
spec:
  hosts:
    - "*"
  gateways:
    - {{ .Values.istio.virtualService.gateways }}
  http:
    - match:
        - uri:
            exact: {{ .Values.istio.virtualService.path }}
      route:
        - destination:
            host: {{ .Values.istio.virtualService.host }}
            port:
              number: {{ .Values.istio.virtualService.port }}
{{- end }}
