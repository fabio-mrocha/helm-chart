{{- if and .Values.cronjob.enabled (not .Values.deployment.enabled) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sample.releaseName" . }}
  {{- with .Values.cronjob.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sample.labels" . | nindent 4 }}
spec:
  concurrencyPolicy: Forbid
  schedule: {{ .Values.cronjob.schedule | quote }}
  timeZone: {{ .Values.cronjob.timeZone | quote }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  suspend: {{ .Values.cronjob.suspend }}
  jobTemplate:
    spec:
      template:
        metadata:
          {{- with .Values.cronjob.jobTemplate.annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "sample.labels" . | nindent 12 }}
            {{- with .Values.cronjob.labels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          containers:
          - name: {{ include "sample.releaseName" . }}
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            {{- if .Values.cronjob.command }}
            command:
              {{- toYaml .Values.cronjob.command | nindent 14 }}
            {{- end }}
            {{- if or .Values.configmap.enabled .Values.secret.external.enabled .Values.configmap.shared.enabled }}
            envFrom:
              {{- if .Values.configmap.shared.enabled }}
              - configMapRef:
                  name: {{ .Values.configmap.shared.name }}
              {{- end }}
              {{- if .Values.configmap.enabled }}
              - configMapRef:
                  name: {{ include "sample.releaseName" . }}
              {{- end }}
              {{- if .Values.secret.external.enabled }}
              - secretRef:
                  name: {{ include "sample.releaseName" . }}
              {{- end }}
            {{- end }}
            {{- with .Values.cronjob.env }}
            env:
              {{- toYaml . | indent 14 }}
            {{- end }}
            {{- with .Values.resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.securityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            volumeMounts:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: {{ .Values.cronjob.jobTemplate.restartPolicy }}
          {{- with .Values.cronjob.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "sample.serviceAccountName" . }}
          {{- with .Values.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
